name: Publish artwork

on:
  workflow_dispatch:
    inputs:
      op:
        description: Operation to perform (add, update or delete)
        required: true
        type: choice
        options:
          - add
          - update
          - delete
      id:
        description: Artwork ID
        required: true
        type: string
      image:
        description: Image path in the repository (used when adding)
        required: false
        type: string
      title:
        description: Artwork title
        required: false
        type: string
      desc_es:
        description: Spanish description
        required: false
        type: string
      desc_en:
        description: English description
        required: false
        type: string
      year:
        description: Artwork year
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update artwork catalog
        env:
          OP: ${{ inputs.op }}
          ARTWORK_ID: ${{ inputs.id }}
          IMAGE_PATH: ${{ inputs.image }}
          TITLE: ${{ inputs.title }}
          DESC_ES: ${{ inputs.desc_es }}
          DESC_EN: ${{ inputs.desc_en }}
          YEAR: ${{ inputs.year }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const file = 'data/artworks.json';
          const op = process.env.OP;
          const id = process.env.ARTWORK_ID;

          if (!['add', 'update', 'delete'].includes(op)) {
            throw new Error(`Unsupported operation: ${op}`);
          }
          if (!/^obra-[a-z0-9]+$/.test(id || '')) {
            throw new Error('Invalid artwork ID');
          }

          const artworks = JSON.parse(fs.readFileSync(file, 'utf8'));
          const index = artworks.findIndex(item => item.id === id);

          if (op === 'add') {
            if (index !== -1) throw new Error(`Artwork already exists: ${id}`);
            const image = process.env.IMAGE_PATH || '';
            const title = (process.env.TITLE || '').trim();
            const year = process.env.YEAR || '';

            if (!image.startsWith('assets/artworks/')) {
              throw new Error('Invalid artwork image path');
            }
            if (!title) throw new Error('Artwork title is required');
            if (!/^\d{0,4}$/.test(year)) throw new Error('Invalid artwork year');

            artworks.unshift({
              id,
              title,
              description: {
                es: process.env.DESC_ES || '',
                en: process.env.DESC_EN || ''
              },
              image,
              year,
              createdAt: new Date().toISOString().slice(0, 10)
            });
          } else if (op === 'update') {
            if (index === -1) throw new Error(`Artwork not found: ${id}`);
            const title = (process.env.TITLE || '').trim();
            const year = process.env.YEAR || '';

            if (!title) throw new Error('Artwork title is required');
            if (!/^\d{0,4}$/.test(year)) throw new Error('Invalid artwork year');

            artworks[index].title = title;
            artworks[index].description = {
              es: process.env.DESC_ES || '',
              en: process.env.DESC_EN || ''
            };
            artworks[index].year = year;
          } else {
            if (index === -1) throw new Error(`Artwork not found: ${id}`);
            artworks.splice(index, 1);
          }

          fs.writeFileSync(file, JSON.stringify(artworks, null, 2) + '\n');
          NODE

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artworks.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "Update artwork catalog"
            git push
          fi
