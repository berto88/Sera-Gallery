<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><meta name="description" content="Galería de arte personal de Sera."><meta property="og:type" content="website"><meta property="og:title" content="Admin"><meta property="og:image" content="assets/images/hero.svg"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="assets/icons/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap"><link rel="stylesheet" href="css/style.css"></head><body data-page="admin"><header id="hdr"></header><main>
<section class="ad" id="login"><form id="lf" class="card"><h1 data-i18n="admin.login"></h1><label><span data-i18n="admin.user"></span><input name="u" autocomplete="username" required></label><label><span data-i18n="admin.pass"></span><input name="p" type="password" autocomplete="current-password" required></label><button class="btn" data-i18n="admin.login"></button><p class="msg" id="lm" role="alert"></p></form></section>
<section class="ad" id="dash" hidden><div class="bar"><h1 data-i18n="admin.title"></h1><button class="btn ghost sm" id="lo" data-i18n="admin.logout"></button></div>
<nav class="tabs" id="tabs"><button data-t="works" class="on" data-i18n="admin.tabWorks"></button><button data-t="col" data-i18n="admin.tabCol"></button><button data-t="proc" data-i18n="admin.tabProc"></button><button data-t="insp" data-i18n="admin.tabInsp"></button></nav><p class="msg" id="am" role="status"></p><div id="t-works"><form id="af" class="card"><h2 data-i18n="admin.add"></h2><label><span data-i18n="admin.image"></span><input type="file" id="fi" accept="image/jpeg,image/png,image/webp"></label><small data-i18n="admin.imgHint"></small><img id="pv" hidden alt=""><label><span data-i18n="admin.titleF"></span><input name="title" maxlength="120" required></label><label><span data-i18n="admin.descEs"></span><textarea name="es" rows="3"></textarea></label><label><span data-i18n="admin.descEn"></span><textarea name="en" rows="3"></textarea></label><label><span data-i18n="admin.year"></span><input name="year" inputmode="numeric" maxlength="4" pattern="\d{4}"></label><button class="btn" data-i18n="admin.submit"></button></form>
<h2 data-i18n="admin.existing"></h2><div id="list"></div></div><div id="t-col" hidden></div><div id="t-proc" hidden></div><div id="t-insp" hidden></div></section>
</main><footer id="ftr"><p data-i18n="footer.rights"></p></footer><script src="js/config.js"></script><script src="js/translations.js"></script><script src="js/translations-ext.js"></script><script src="js/main.js"></script><script src="js/admin.js"></script><script src="js/admin-content.js"></script></body></html>
